<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teamets mål hösten 2026</title>
<style>
  :root {
    --bg: #0f1117; --card: #1a1d27; --border: #2a2d3a; --text: #e8eaf0; --muted: #6b7080;
    --lime: #22c55e; --amber: #f59e0b; --accent: #6366f1; --idle: #3a3d4a;
    --s: 1; /* skalfaktor, justeras av skriptet så att allt ryms utan scroll */
    --cols: 2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
    padding: 2.4vh 2.4vw;
    font-size: calc(2.2vh * var(--s));
  }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 3vw; margin-bottom: 2.4vh; flex: none; }
  h1 { font-size: 4.6vh; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  h1 span { color: var(--accent); }
  .deadline { color: var(--muted); font-size: 2.1vh; margin-top: 0.6vh; }
  .deadline strong { color: var(--text); }

  .overall { display: flex; align-items: center; gap: 1.6vw; min-width: 38vw; }
  .overall .pct { font-size: 6.4vh; font-weight: 800; color: var(--accent); line-height: 1; min-width: 9vh; text-align: right; }
  .overall .bar-wrap { flex: 1; }
  .overall .bar-label { font-size: 1.9vh; color: var(--muted); margin-bottom: 0.8vh; }
  .bar { height: 1.8vh; border-radius: 999px; background: var(--idle); overflow: hidden; display: flex; }
  .fill { height: 100%; border-radius: 999px; transition: width .6s ease, background-color .6s ease; background: var(--idle); }
  .fill.doing { background: var(--amber); }
  .fill.done { background: var(--lime); }
  .legend { display: flex; gap: 1.4vw; margin-top: 0.9vh; font-size: 1.7vh; color: var(--muted); }
  .legend i { display: inline-block; width: 1.2vh; height: 1.2vh; border-radius: 50%; margin-right: 0.5vw; }

  #grid {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
    gap: calc(1.6vh * var(--s)) calc(1.2vw * var(--s));
    align-content: start;
  }
  .cell { min-width: 0; display: flex; flex-direction: column; gap: calc(1.6vh * var(--s)); }
  .cell > .goal:last-child { flex: 1 1 auto; }
  #grid.measuring .cell { align-self: start; }
  #grid.measuring .cell > .goal:last-child { flex: none; }
  .goal { background: var(--card); border: 1px solid var(--border); border-radius: 1.4vh; padding: calc(1.8vh * var(--s)) calc(1.4vw * var(--s)); }
  .goal-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1vw; margin-bottom: calc(1.2vh * var(--s)); }
  .goal-title { font-weight: 700; font-size: 1.25em; line-height: 1.2; }
  .tag { display: inline-block; font-size: 0.6em; font-weight: 700; background: rgba(99,102,241,.15); color: var(--accent); border-radius: 0.6vh; padding: 0.2vh 0.7vw; margin-left: 0.6vw; vertical-align: middle; }
  .count { color: var(--muted); white-space: nowrap; font-size: 0.9em; }
  .count strong { color: var(--text); }
  .goal-bar { height: 0.7vh; border-radius: 999px; background: var(--idle); margin-bottom: calc(1.2vh * var(--s)); overflow: hidden; display: flex; }
  ul { list-style: none; display: flex; flex-direction: column; gap: calc(0.7vh * var(--s)); }
  li { display: flex; gap: 0.8vw; align-items: flex-start; line-height: 1.25; padding: calc(0.7vh * var(--s)) calc(0.8vw * var(--s)); border-radius: 0.9vh; background: rgba(58,61,74,.4); color: #9a9db0; }
  li .ico { flex: none; width: 1.3em; height: 1.3em; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8em; font-weight: 800; background: var(--idle); color: var(--muted); margin-top: 0.05em; }
  li.doing { background: rgba(245,158,11,.12); box-shadow: inset 0 0 0 1px rgba(245,158,11,.25); color: var(--text); }
  li.doing .ico { background: var(--amber); color: #1a1d27; }
  li.done { background: rgba(34,197,94,.12); box-shadow: inset 0 0 0 1px rgba(34,197,94,.25); color: var(--text); }
  li.done .ico { background: var(--lime); color: #1a1d27; }

  footer { flex: none; margin-top: 1.2vh; text-align: right; font-size: 1.5vh; color: var(--muted); }
  footer.stale { color: var(--amber); }
  .error { color: var(--amber); text-align: center; padding: 8vh 0; font-size: 3vh; grid-column: 1 / -1; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Teamets mål <span>hösten 2026</span></h1>
    <div class="deadline">Deadline <strong>18 december 2026</strong> · <span id="daysLeft"></span></div>
  </div>
  <div class="overall">
    <div class="pct" id="pct">–</div>
    <div class="bar-wrap">
      <div class="bar-label">Delmål klara totalt</div>
      <div class="bar"><div class="fill" id="barFill"></div></div>
      <div class="legend">
        <span><i style="background:var(--idle)"></i>Ej påbörjat</span>
        <span><i style="background:var(--amber)"></i>Pågår</span>
        <span><i style="background:var(--lime)"></i>Klart (från 80 %)</span>
      </div>
    </div>
  </div>
</header>
<div id="grid"></div>
<footer id="footer"></footer>

<script>
var DEADLINE = new Date(2026, 11, 18, 23, 59, 59);
var RAW_URL = "https://raw.githubusercontent.com/FredrikAsplund/Support-mal-dashboard/main/mal_data.json";
var PAGES_URL = "mal_data.json";
var DATA_REFRESH_MS = 5 * 60 * 1000;   // hämta ny data var 5:e minut
var PAGE_RELOAD_MS = 60 * 60 * 1000;   // ladda om hela sidan varje timme (hämtar ny design)
var params = new URLSearchParams(location.search);
var lastData = null, lastOk = null;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function fetchJson(url) {
  return fetch(url + (url.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
}
function loadData() {
  if (params.get("src")) return fetchJson(params.get("src"));
  return fetchJson(RAW_URL).catch(function () { return fetchJson(PAGES_URL); });
}
function statusClass(s) {
  var v = String(s || "").toLowerCase().trim();
  if (/^(klart|klar|slutf|done|avklarad)/.test(v)) return "done";
  if (/^(pågå|paga|pågå|påbörjad|in progress|igång)/.test(v) && v.indexOf("ej ") !== 0) return "doing";
  return "idle";
}
function pick(row, names) {
  for (var i = 0; i < names.length; i++) if (row[names[i]] != null && row[names[i]] !== "") return row[names[i]];
  return "";
}
function group(data) {
  var goals = {}, order = [];
  data.forEach(function (row) {
    var name = pick(row, ["Mål", "Mal", "mål", "mal"]);
    if (!name) return;
    if (!goals[name]) { goals[name] = { tag: "", subs: [] }; order.push(name); }
    var tag = pick(row, ["Tag", "tag"]);
    if (tag && !goals[name].tag) goals[name].tag = tag;
    var text = pick(row, ["Delmål", "Delmal", "delmål", "delmal"]);
    if (text) goals[name].subs.push({ text: text, cls: statusClass(pick(row, ["Status", "status"])) });
  });
  return order.map(function (n) { return { name: n, tag: goals[n].tag, subs: goals[n].subs }; });
}
// En stapel med en färg: grå = ej påbörjat, orange = pågår, grön från 80 % klart.
function barState(done, doing, total) {
  var pct = total ? done / total * 100 : 0;
  var started = done > 0 || doing > 0;
  var cls = pct >= 80 ? "done" : started ? "doing" : "idle";
  var w = pct > 0 ? pct : started ? 4 : 0; // liten orange start när inget är klart men något pågår
  return { w: w, cls: cls };
}
var ICON = { done: "✓", doing: "▶", idle: "○" };

function render(data) {
  var goals = group(data), total = 0, done = 0, doing = 0;
  var cards = goals.map(function (g) {
    var gd = 0, gp = 0;
    g.subs.forEach(function (s) { if (s.cls === "done") gd++; else if (s.cls === "doing") gp++; });
    total += g.subs.length; done += gd; doing += gp;
    var b = barState(gd, gp, g.subs.length);
    return '<section class="goal"><div class="goal-head"><div class="goal-title">' + esc(g.name) +
      (g.tag ? '<span class="tag">' + esc(g.tag) + '</span>' : '') +
      '</div><div class="count"><strong>' + gd + '/' + g.subs.length + '</strong> klara</div></div>' +
      '<div class="goal-bar"><div class="fill ' + b.cls + '" style="width:' + b.w + '%"></div></div><ul>' +
      g.subs.map(function (s) { return '<li class="' + s.cls + '"><span class="ico">' + ICON[s.cls] + '</span><span>' + esc(s.text) + '</span></li>'; }).join("") +
      '</ul></section>';
  });
  var b = barState(done, doing, total);
  document.getElementById("pct").textContent = (total ? Math.round(done / total * 100) : 0) + "%";
  var fill = document.getElementById("barFill");
  fill.className = "fill " + b.cls; fill.style.width = b.w + "%";
  fit(cards);
}

// Rutnät där alla kort på samma rad slutar på samma höjd. Mål som inte fyller en hel
// sista rad staplas under kortet i sista hela raden som har mest ledigt utrymme.
function layout(cards, cols) {
  var grid = document.getElementById("grid"), cells = [];
  var full = cards.length - cards.length % cols;
  if (full === 0) full = cards.length;
  grid.innerHTML = "";
  for (var i = 0; i < full; i++) {
    var cell = document.createElement("div");
    cell.className = "cell";
    cell.innerHTML = cards[i];
    grid.appendChild(cell);
    cells.push(cell);
  }
  var lastRow = cells.slice(Math.max(0, full - cols));
  grid.classList.add("measuring");
  for (var j = full; j < cards.length; j++) {
    var target = lastRow[0];
    lastRow.forEach(function (c) { if (c.offsetHeight < target.offsetHeight) target = c; });
    target.insertAdjacentHTML("beforeend", cards[j]);
  }
  grid.classList.remove("measuring");
}

// Välj antal kolumner efter antal mål och krymp tills allt ryms utan scroll.
function fit(cards) {
  var n = cards.length, grid = document.getElementById("grid"), root = document.documentElement;
  var cols = n <= 2 ? n || 1 : n <= 4 ? 2 : n <= 9 ? 3 : 4;
  root.style.setProperty("--cols", cols);
  var s = 1.7;
  for (; s > 0.35; s -= 0.025) {
    root.style.setProperty("--s", s);
    layout(cards, cols);
    if (grid.scrollHeight <= grid.clientHeight + 1) break;
  }
}
function updateDays() {
  var days = Math.ceil((DEADLINE - new Date()) / 86400000);
  document.getElementById("daysLeft").textContent =
    days > 1 ? days + " dagar kvar" : days === 1 ? "1 dag kvar" : days === 0 ? "sista dagen!" : "deadline passerad";
}
function refresh() {
  loadData().then(function (data) {
    if (!Array.isArray(data) || !data.length) throw new Error("tom data");
    lastData = data; lastOk = new Date();
    render(data);
    var f = document.getElementById("footer"); f.className = "";
    f.textContent = "Uppdaterad " + lastOk.toLocaleString("sv-SE", { dateStyle: "short", timeStyle: "short" });
  }).catch(function () {
    var f = document.getElementById("footer");
    if (lastData) {
      f.className = "stale";
      f.textContent = "Kunde inte hämta ny data – visar data från " + lastOk.toLocaleTimeString("sv-SE", { timeStyle: "short" });
    } else {
      document.getElementById("grid").innerHTML = '<p class="error">Kunde inte ladda data just nu. Försöker igen strax.</p>';
      setTimeout(refresh, 30000);
    }
  });
}
window.addEventListener("resize", function () { if (lastData) render(lastData); });
updateDays(); setInterval(updateDays, 3600000);
refresh(); setInterval(refresh, DATA_REFRESH_MS);
setTimeout(function () { location.reload(); }, PAGE_RELOAD_MS);
</script>
</body>
</html>
